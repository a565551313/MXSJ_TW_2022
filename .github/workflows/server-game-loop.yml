name: Server game-loop tests

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - "agent/server-login-foundation-*"
  pull_request:
    paths:
      - "server/src/mxsj_server/**"
      - "server/migrations/**"
      - "server/tests/architecture/**"
      - "server/tests/integration/**"
      - "server/tests/protocol/**"
      - "server/tools/verify_game_loop.py"
      - ".github/workflows/server-game-loop.yml"

jobs:
  stdlib-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Architecture contract tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s server/tests/architecture -v
      - name: Account input validation tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s server/tests/modules/account -v
      - name: Game-loop integration tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s server/tests/integration -v
      - name: TCP protocol tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s server/tests/protocol -v

      - name: End-to-end registration-to-map smoke test
        run: PYTHONDONTWRITEBYTECODE=1 python server/tools/verify_game_loop.py --database /tmp/mxsj-game-loop-smoke.sqlite3 --skip-unit-tests
