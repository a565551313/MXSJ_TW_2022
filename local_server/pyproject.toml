[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mxsj-local-server"
version = "0.2.0"
description = "独立 SQLite 本地服务端基础"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mxsj-local-server = "mxsj_local_server.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
