[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mxsj-map-editor"
version = "0.1.0"
description = "《夢想世界》地图编辑器（第一期：只读）"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0", "PySide6>=6.6"]

[project.scripts]
map-editor = "map_editor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
map_editor = ["../data/*.json"]
