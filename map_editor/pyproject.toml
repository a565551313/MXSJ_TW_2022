[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mxsj-map-editor"
version = "1.0.0"
description = "《夢想世界》客户端地图编辑器 — 完整支持 0.1M .map / .blk / GEPJ / LLEC / GIRB / 前景遮罩读写与校验"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0", "PySide6>=6.6"]

[project.scripts]
map-editor = "map_editor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
map_editor = ["../data/*.json"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
