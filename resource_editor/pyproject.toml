[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mxsj-resource-editor"
version = "0.3.4"
description = "梦想世界（MXSJ）客户端 FLS 资源包编辑器"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "PySide6>=6.4",
    "Pillow>=9.0",
]

[project.gui-scripts]
mxsj-resource-editor = "resource_editor.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
