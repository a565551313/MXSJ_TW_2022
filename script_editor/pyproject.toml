[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mxsj-script-editor"
version = "0.5.0.dev1"
description = "MXSJ dual-VM package editor with unverified recovery drafts"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "Mixed: editor proprietary; separate recovery_worker.py GPL-3.0-or-later; see licenses/recovery" }
dependencies = ["PySide6==6.10.3", "uncompyle6==3.9.3", "xdis==6.1.8", "spark-parser==1.9.0", "six==1.17.0", "click==8.5.0"]

[project.gui-scripts]
mxsj-script-editor = "script_editor.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
script_editor = ["data/*.py"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
