[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mxsj-script-editor"
version = "0.1.0.dev1"
description = "MXSJ standalone dual-VM script editor foundation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = ["PySide6>=6.4"]

[project.gui-scripts]
mxsj-script-editor = "script_editor.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
script_editor = ["data/*.py"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
