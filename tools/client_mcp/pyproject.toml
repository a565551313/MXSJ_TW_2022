[project]
name = "mxsj-client-mcp"
version = "0.1.0"
description = "Client-native MCP access tools for the MXSJ test client (M3: MCP server + fake probe, Linux dev mode)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.30.0,<2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
]

[project.scripts]
mxsj-client-mcp = "mxsj_client_mcp.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
