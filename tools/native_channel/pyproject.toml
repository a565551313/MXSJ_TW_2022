[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mxsj-native-channel"
version = "0.1.0"
description = "Offline evidence-backed candidate native game TCP codec"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mxsj-native-channel = "mxsj_native_channel.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
