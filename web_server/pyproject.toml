[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mxsj-web-server"
version = "0.3.0"
description = "独立客户端 Web 文本分发服务"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.4,<7"]

[project.scripts]
mxsj-web-content = "mxsj_web_server.app:content_main"

[project.gui-scripts]
mxsj-web-server = "mxsj_web_server.app:entry_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mxsj_web_server = ["data/*.json", "data/public/*.txt", "gui/README.md", "web/admin/static/*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
